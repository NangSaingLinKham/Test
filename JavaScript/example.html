<!DOCTYPE html>
<html>
<head>
<style>
/* နောက်ခံ Container ကြီး */
#container {
  width: 400px; height: 400px;
  position: relative; background: blue;
}
/* တကယ် ရွေ့လျားမယ့် အနီရောင် Box လေး */
#animate {
  width: 50px; height: 50px;
  position: absolute; background: red;
}
</style>
</head>
<body>

<p><button onclick="myMove()">ရွေ့ရန် နှိပ်ပါ</button></p>

<div id="container">
  <div id="animate"></div>
</div>

<script>
function myMove() {
  let elem = document.getElementById("animate");   
  let pos = 0; // စမှတ် တည်နေရာ
  
  // ၁၀ မီလီစက္ကန့်တိုင်းမှာ frame() ဆိုတဲ့ function ကို ထပ်ခါတလဲလဲ ခေါ်မယ်
  let id = setInterval(frame, 10);
  
  function frame() {
    if (pos == 350) {
      clearInterval(id); // တည်နေရာ ၃၅၀ ရောက်ရင် Timer ကို ရပ်လိုက်မယ်
    } else {
      pos++; 
      elem.style.top = pos + 'px';  // အောက်ကို ရွေ့ချင်ရင်
      elem.style.left = pos + 'px'; // ညာဘက်ကို ရွေ့ချင်ရင်
    }
  }
}
</script>

</body>
</html>
