<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --header-gradient: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-grid: #cbd5e1;
            --border-container: #b4c6ef;
            --primary-color: #ff6b00;
            --primary-hover: #e05e00;
            --edit-btn: #0ea5e9;
            --edit-hover: #0284c7;
            --delete-btn: #f43f5e;
            --delete-hover: #e11d48;
            --focus-ring: rgba(79, 70, 229, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 60px;
        }

        header {
            background: var(--header-gradient);
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 10px 25px -5px rgba(55, 48, 163, 0.15);
        }

        header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            color: #1e3a8a;
            font-size: 22px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            margin-bottom: 50px;
            border: 2px solid var(--border-container);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: #1e1b4b;
            color: #f8fafc;
            font-weight: 600;
            padding: 18px 16px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 18px 16px;
            font-size: 14px;
            color: #334155;
            font-weight: 500;
            border-bottom: 1px solid var(--border-grid);
            border-right: 1px solid var(--border-grid);
        }

        td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover td {
            background-color: rgba(241, 245, 249, 0.8);
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 4px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-edit {
            background-color: var(--edit-btn);
            color: white;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-delete {
            background-color: var(--delete-btn);
            color: white;
        }

        .btn-delete:hover {
            background-color: var(--delete-hover);
        }

        .form-container {
            background: var(--card-bg);
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border-container);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #a1b1cc;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px var(--focus-ring);
            background-color: white;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff6b00 0%, #ff8833 100%);
            color: white;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(255, 107, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #e05e00 0%, #ff6b00 100%);
            transform: translateY(-1px);
        }

        .no-data {
            padding: 35px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Job Application Portal</h1>
    </header>

    <div class="container">
        <h2>Available Job Positions</h2>
        <div class="table-container">
            <table id="jobTable">
                <thead>
                    <tr>
                        <th>Job Title</th>
                        <th>Department</th>
                        <th>Location</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobList"></tbody>
            </table>
        </div>

        <h2>Manage Jobs</h2>
        <div class="form-container">
            <form id="jobForm">
                <input type="hidden" id="jobId">
                <div class="form-group">
                    <label for="jobTitle">Job Title</label>
                    <input type="text" id="jobTitle" class="form-control" placeholder="e.g. Web Developer" required>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" class="form-control" placeholder="e.g. IT" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. New York" required>
                </div>
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="text" id="salary" class="form-control" placeholder="e.g. $80,000" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">Save Job</button>
            </form>
        </div>
    </div>

    <script>

        const jobForm = document.getElementById('jobForm');
        const jobList = document.getElementById('jobList');
        const jobIdInput = document.getElementById('jobId');
        const jobTitleInput = document.getElementById('jobTitle');
        const departmentInput = document.getElementById('department');
        const locationInput = document.getElementById('location');
        const salaryInput = document.getElementById('salary');
        const submitBtn = document.getElementById('submitBtn');

        const initialJobs = [
            { id: "1", title: "Web Developer", dept: "IT", loc: "New York", sal: "$80,000" },
            { id: "2", title: "Graphic Designer", dept: "Marketing", loc: "San Francisco", sal: "$80,000" }
        ];


        let jobs = JSON.parse(localStorage.getItem('jobs'));
        if (jobs == null) {
            jobs = initialJobs;
            localStorage.setItem('jobs', JSON.stringify(jobs));
        }


        function displayJobs() {
            jobList.innerHTML = "";

            if (jobs.length == 0) {
                jobList.innerHTML = "<tr><td colspan='5' class='no-data'>No job positions available.</td></tr>";
                return;
            }


            for (let i = 0; i < jobs.length; i++) {
                let job = jobs[i];
                let tr = document.createElement('tr');

                tr.innerHTML = "<td>" + job.title + "</td>" +
                    "<td>" + job.dept + "</td>" +
                    "<td>" + job.loc + "</td>" +
                    "<td style='color:#16a34a; font-weight:600;'>" + job.sal + "</td>" +
                    "<td>" +
                    "<button class='btn btn-edit' onclick='editJob(\"" + job.id + "\")'>Edit</button>" +
                    "<button class='btn btn-delete' onclick='deleteJob(\"" + job.id + "\")'>Delete</button>" +
                    "</td>";

                jobList.appendChild(tr);
            }
        }

        jobForm.addEventListener('submit', function (e) {
            e.preventDefault();

            let id = jobIdInput.value;
            let title = jobTitleInput.value;
            let dept = departmentInput.value;
            let loc = locationInput.value;
            let sal = salaryInput.value;

            if (id != "") {
                for (let i = 0; i < jobs.length; i++) {
                    if (jobs[i].id == id) {
                        jobs[i].title = title;
                        jobs[i].dept = dept;
                        jobs[i].loc = loc;
                        jobs[i].sal = sal;
                        break;
                    }
                }
                submitBtn.textContent = 'Save Job';
            } else {

                let newJob = {
                    id: Date.now().toString(),
                    title: title,
                    dept: dept,
                    loc: loc,
                    sal: sal
                };
                jobs.push(newJob);
            }


            localStorage.setItem('jobs', JSON.stringify(jobs));
            displayJobs();
            jobForm.reset();
            jobIdInput.value = "";
        });

        window.editJob = function (id) {
            for (let i = 0; i < jobs.length; i++) {
                if (jobs[i].id == id) {
                    let jobToEdit = jobs[i];
                    jobIdInput.value = jobToEdit.id;
                    jobTitleInput.value = jobToEdit.title;
                    departmentInput.value = jobToEdit.dept;
                    locationInput.value = jobToEdit.loc;
                    salaryInput.value = jobToEdit.sal;
                    submitBtn.textContent = 'Update Job';
                    jobForm.scrollIntoView({ behavior: 'smooth' });
                    break;
                }
            }
        };
        window.deleteJob = function (id) {
            if (confirm('Are you sure you want to delete this job position?')) {
                for (let i = 0; i < jobs.length; i++) {
                    if (jobs[i].id == id) {
                        jobs.splice(i, 1);
                        break;
                    }
                }

                localStorage.setItem('jobs', JSON.stringify(jobs));
                displayJobs();
                if (jobIdInput.value == id) {
                    jobForm.reset();
                    jobIdInput.value = "";
                    submitBtn.textContent = 'Save Job';
                }
            }
        };

        displayJobs();
        
    </script>
</body>
</html>
