<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Bootstrap Table</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* အေးမြတဲ့ နောက်ခံအရောင် */
            padding-top: 50px;
        }
        /* Table ကို ထောင့်ကွေးလေးနဲ့ အရိပ်ထည့်ဖို့ */
        .custom-table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        /* Table Head ကို စိတ်ကြိုက်အရောင်ပြောင်းရန် */
        .thead-custom {
            background-color: #212529; /* ပုံထဲကအတိုင်း အမည်းရောင်ရင့်ရင့် */
            color: white;
        }
        /* Salary ကဏ္ဍကို ထင်ရှားအောင်လုပ်ခြင်း */
        .salary-bold {
            font-weight: 800;
            color: #afd1f3;
        }
        /* Row ပေါ် mouse တင်ရင် အရောင်ပြောင်းရန် */
        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 fw-bold" style="color: #343a40;">Available Job Positions</h2>

    <div class="custom-table-container">
        <table class="table table-hover m-0">
            <thead class="thead-custom text-center">
                <tr>
                    <th class="py-3 px-4">Job Title</th>
                    <th class="py-3 px-4">Department</th>
                    <th class="py-3 px-4">Location</th>
                    <th class="py-3 px-4">Salary</th>
                </tr>
            </thead>
            <tbody class="text-center align-middle">
                <tr>
                    <td class="py-3">Web Developer</td>
                    <td>IT</td>
                    <td>New York</td>
                    <td class="salary-bold">$80,000</td>
                </tr>
                <tr>
                    <td class="py-3">Graphic Designer</td>
                    <td>Marketing</td>
                    <td>San Francisco</td>
                    <td class="salary-bold">$70,000</td>
                </tr>
                <tr>
                    <td class="py-3">Project Manager</td>
                    <td>Operations</td>
                    <td>Los Angeles</td>
                    <td class="salary-bold">$90,000</td>
                </tr>
                <tr>
                    <td class="py-3">HR Specialist</td>
                    <td>Human Resources</td>
                    <td>Chicago</td>
                    <td class="salary-bold">$60,000</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap Bundle with Popper JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
