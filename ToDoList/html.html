<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="todo-container">
        <div class="todo-header">
            <h1>To-Do App</h1>
        </div>

        <div class="progress-container">
            <div class="progress-info">
                <span id="progress-text">Let's add some tasks! 🎯</span>
                <div class="progress-circle" id="progress-stats">0 / 0</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="input-grid">
            <input type="text" id="todo-input" placeholder="Add a new task...">
            
            <div class="input-sub-row">
                <select id="category-select">
                    <option value="💻 Work">💻 Work</option>
                    <option value="📚 Study">📚 Study</option>
                    <option value="🏠 Personal">🏠 Personal</option>
                </select>
                <input type="date" id="todo-date">
                <button id="add-btn"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">All</button>
            <button class="tab-btn" data-filter="active">Active</button>
            <button class="tab-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="control-footer">
            <button id="clear-completed-btn" class="footer-btn">Clear Completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
